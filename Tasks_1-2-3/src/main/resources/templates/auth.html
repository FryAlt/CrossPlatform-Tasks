<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация | TechHub</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="header">
    <div class="logo">TechHub</div>
    <nav><a href="/">На главную</a></nav>
</header>

<main class="auth-container">
    <h2>Регистрация</h2>
    <p th:if="${error}" th:text="${error}" class="error"></p>
    <form th:action="@{/register}" th:object="${registrationDto}" method="post">
        <input type="text" th:field="*{username}" placeholder="Логин" required>
        <input type="email" th:field="*{email}" placeholder="Email" required>
        <input type="password" th:field="*{password}" placeholder="Пароль" required>
        <button type="submit">Зарегистрироваться</button>
    </form>
</main>

<footer class="footer"><p class="copyright">© 2026 TechHub</p></footer>
</body>
</html>
