services:
  postgres:
    image: postgres:18
    container_name: pg_db
    environment:
      POSTGRES_DB: crud_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  java-app:
    build: .
    container_name: java_crud
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/crud_db
      DB_USER: postgres
      DB_PASSWORD: admin
    restart: "no"

volumes:
  pgdata:
